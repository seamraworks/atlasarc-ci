version: 2.1

orbs:
  github-maven-deploy: github-maven-deploy/github-maven-deploy@1.3.2

executors:
  jdk21:
    docker:
      - image: cimg/openjdk:21.0

jobs:
  build-and-test:
    executor: jdk21
    steps:
      # Seamra Works disables GitHub deploy keys. This public-source checkout avoids granting a
      # user key while still pinning the workspace to the exact commit that triggered the pipeline.
      - run:
          name: Check out public source
          command: |
            git clone --filter=blob:none https://github.com/seamraworks/atlasarc-ci.git .
            git checkout "$CIRCLE_SHA1"
            git remote set-url origin git@github.com:seamraworks/atlasarc-ci.git
      - restore_cache:
          key: atlasarc-ci-maven-{{ checksum "pom.xml" }}
      - run:
          name: Build and test
          command: mvn --batch-mode verify -Ppublish-cli
      - run:
          name: Verify Maven Central artifacts
          command: |
            for module in atlasarc-governance-core atlasarc-archunit atlasarc-ci; do
              sources_jar=$(find "$module/target" -maxdepth 1 -name "$module-*-sources.jar" -print -quit)
              javadoc_jar=$(find "$module/target" -maxdepth 1 -name "$module-*-javadoc.jar" -print -quit)
              test -n "$sources_jar"
              test -n "$javadoc_jar"
              test -f "$sources_jar"
              test -f "$javadoc_jar"
              jar tf "$sources_jar" | grep -Eq '\.(kt|java)$'
            done
      - run:
          name: Collect release candidate and test results
          command: |
            mkdir -p artifacts/junit
            cp atlasarc-ci/target/atlasarc-ci-*.zip artifacts/
            cp atlasarc-ci/target/atlasarc-ci-*-standalone.jar artifacts/
            cp atlasarc-ci/target/SHA256SUMS artifacts/
            find . -path '*/target/surefire-reports/TEST-*.xml' -exec cp {} artifacts/junit/ \;
      - persist_to_workspace:
          root: .
          paths: [.]
      - store_artifacts:
          path: artifacts
      - store_test_results:
          path: artifacts/junit

mvn-deploy-command: &mvn-deploy-command
  executor: jdk21
  mvn-deploy-command: >-
    mvn -s .circleci/maven-central-settings.xml --batch-mode clean deploy
    -Ppublish-cli -DdeployAtEnd=true -DperformRelease=true -DskipTests -Djacoco.skip=true
  context: RELEASE_PROFILE_BBOTTEMA
  deploy-no-output-timeout: 30m

workflows:
  build-test-and-release:
    jobs:
      - build-and-test:
          filters:
            branches:
              only: main

      - github-maven-deploy/approve-deploy-patch-version:
          type: approval
          requires: [build-and-test]
      - github-maven-deploy/approve-deploy-minor-version:
          type: approval
          requires: [build-and-test]
      - github-maven-deploy/approve-deploy-major-version:
          type: approval
          requires: [build-and-test]
      - github-maven-deploy/approve-deploy-as-is-version:
          type: approval
          requires: [build-and-test]

      - github-maven-deploy/deploy-patch-version:
          requires: [github-maven-deploy/approve-deploy-patch-version]
          <<: *mvn-deploy-command
      - github-maven-deploy/deploy-minor-version:
          requires: [github-maven-deploy/approve-deploy-minor-version]
          <<: *mvn-deploy-command
      - github-maven-deploy/deploy-major-version:
          requires: [github-maven-deploy/approve-deploy-major-version]
          <<: *mvn-deploy-command
      - github-maven-deploy/deploy-as-is-version:
          requires: [github-maven-deploy/approve-deploy-as-is-version]
          <<: *mvn-deploy-command
