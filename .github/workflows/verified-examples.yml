name: Verified examples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verified-examples.yml
      - examples/verified-governance/**
  pull_request:
    paths:
      - .github/workflows/verified-examples.yml
      - examples/verified-governance/**

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Java · JUnit · rejects ungoverned cycle
            language: jvm
            integration: junit
            scenario: ungoverned
          - name: Java · JUnit · allows governed cycle
            language: jvm
            integration: junit
            scenario: governed
          - name: Java · Standalone · rejects ungoverned cycle
            language: jvm
            integration: standalone
            scenario: ungoverned
          - name: Java · Standalone · allows governed cycle
            language: jvm
            integration: standalone
            scenario: governed
          - name: Java · ArchUnit · rejects ungoverned cycle
            language: jvm
            integration: archunit
            scenario: ungoverned
          - name: Java · ArchUnit · allows governed cycle
            language: jvm
            integration: archunit
            scenario: governed
          - name: TypeScript · Standalone · rejects ungoverned cycle
            language: typescript
            integration: standalone
            scenario: ungoverned
          - name: TypeScript · Standalone · allows governed cycle
            language: typescript
            integration: standalone
            scenario: governed

    steps:
      - name: Check out examples
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up Node 24
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/verified-governance/typescript-cycle/package-lock.json

      - name: Verify published integration behavior
        run: >-
          bash examples/verified-governance/verify-example.sh
          ${{ matrix.language }}
          ${{ matrix.integration }}
          ${{ matrix.scenario }}
