name: Bug report
description: Report a reproducible AtlasArc.io CI defect
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: AtlasArc.io CI version
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Standalone CLI, ArchUnit adapter, Governance core]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove private source, reasons, tickets, and workstation paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
